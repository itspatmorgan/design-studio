name: Checks and deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run exhaustive release fixtures and upgrade rehearsals
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_checks:
        description: Run exhaustive release fixtures and upgrade rehearsals
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Keep the tested OS stable when GitHub advances ubuntu-latest.
  # Preserve the required check name "scope" (ownership, identity, and assets).
  scope:
    runs-on: ubuntu-24.04
    concurrency:
      group: scope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Check ownership, permanent identities, and asset sizes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STUDIO_SCOPE_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE_REF=$(git merge-base "$BASE_REF" "$HEAD_REF")
            node src/platform/node/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF" --review
          else
            STUDIO_PLATFORM_ROLE=$(gh api "repos/$REPOSITORY/collaborators/$PUSH_ACTOR/permission" --jq '.role_name')
            export STUDIO_PLATFORM_ROLE
            node src/platform/node/check/check-scope.js --ci "$BASE_REF" "$HEAD_REF"
          fi
          node src/platform/node/check/check-asset-size.js --ci "$BASE_REF" "$HEAD_REF"
      # Only the upstream project requires every path to be named in the ownership map; a studio's own files are its own.
      - name: Check the ownership map covers every path
        if: github.repository_id == '1401250166'
        run: node src/platform/node/check/check-ownership.js --strict
      - name: Keep personal contributor files out of the starter and public demo
        if: github.repository_id == '1401250166'
        run: node src/platform/node/check/check-starter.js
  regressions:
    name: Selected regressions
    runs-on: ubuntu-24.04
    concurrency:
      group: regressions-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      STUDIO_FULL_CHECKS: ${{ inputs.full_checks || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Select affected regression groups
        id: plan
        run: node src/platform/node/check/test.js --changed "$BASE_REF" "$HEAD_REF" --plan-only
      - name: Locate dependency store
        if: steps.plan.outputs.tests_needed == 'true'
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.plan.outputs.tests_needed == 'true'
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
        if: steps.plan.outputs.tests_needed == 'true'
      - name: Run selected regressions
        if: steps.plan.outputs.tests_needed == 'true'
        run: node src/platform/node/check/test.js --changed "$BASE_REF" "$HEAD_REF"
  bundle:
    name: Production build
    runs-on: ubuntu-24.04
    concurrency:
      group: bundle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Locate dependency store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm studio sync --check
      - run: pnpm format:check
      - name: Verify public contract and report PR changes
        if: github.repository_id == '1401250166'
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm contract --released --base "$CONTRACT_BASE"
      - run: pnpm build
        env:
          STUDIO_BASE_PATH: ${{ github.repository_id == '1401250166' && '/design-studio-demo/' || '/' }}
          STUDIO_PUBLIC_URL: ${{ github.repository_id == '1401250166' && 'https://itspatmorgan.com/design-studio-demo/' || '' }}
      - run: pnpm build:inspect
  # Exhaustive upgrade rehearsals run only on explicit full/manual checks; ordinary updater regressions remain in PRs.
  upgrade:
    name: Upgrade test
    if: github.repository_id == '1401250166' && inputs.full_checks == true
    runs-on: ubuntu-24.04
    concurrency:
      group: upgrade-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v5
      - name: Locate dependency store
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - run: pnpm install --frozen-lockfile
      # Rehearse the actual command within the candidate foundation and, after launch, from the supported release.
      - name: Rehearse the actual update command
        run: |
          node src/platform/node/check/upgrade-test.js
          RELEASE=$(git tag --list 'v*' --sort=-v:refname | node --input-type=module -e "import fs from 'node:fs'; import {isSupportedRelease} from './src/platform/node/lib/release-versions.js'; console.log(fs.readFileSync(0,'utf8').trim().split('\n').find(tag => isSupportedRelease(tag)) ?? '')")
          if [ -n "$RELEASE" ]; then
            node src/platform/node/check/upgrade-test.js --from "$RELEASE"
          fi
  # Keep the existing required check name. A successful bundle alone cannot pass it.
  build:
    needs: [bundle, regressions, upgrade]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require bundle, regression, and upgrade success
        env:
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          REGRESSION_RESULT: ${{ needs.regressions.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
          UPGRADE_REQUIRED: ${{ github.repository_id == '1401250166' && inputs.full_checks == true }}
        run: |
          test "$BUNDLE_RESULT" = success && test "$REGRESSION_RESULT" = success || exit 1
          if [ "$UPGRADE_REQUIRED" = true ]; then
            test "$UPGRADE_RESULT" = success || exit 1
          fi
