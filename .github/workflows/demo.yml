name: Publish demo

on:
  workflow_run:
    workflows: [Checks and deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-demo
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository_id == '1401250166' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == 1401250166))
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the website's combined deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set WEBSITE_DEPLOY_TOKEN to a fine-grained token with Actions read/write access to itspatmorgan/itspatmorgan.com. See src/platform/context/maintainers/releasing.md."
            exit 1
          fi
          gh api --method POST repos/itspatmorgan/itspatmorgan.com/actions/workflows/deploy.yml/dispatches -f ref=main
